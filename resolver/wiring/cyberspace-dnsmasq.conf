# cyberspace-dnsmasq.conf — dnsmasq snippet

# Append to /etc/dnsmasq.conf or drop into /etc/dnsmasq.d/cyberspace.conf,
# then: sudo systemctl restart dnsmasq
#
# Only .cyberspace goes to the daemon; every other name keeps the
# machine's normal upstream. Split-horizon by construction.

server=/.cyberspace/127.0.0.1#5353

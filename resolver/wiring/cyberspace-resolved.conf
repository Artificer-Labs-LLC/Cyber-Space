# cyberspace-resolved.conf — systemd-resolved drop-in (her machine, HQ node)

# Copy to /etc/systemd/resolved.conf.d/cyberspace-resolved.conf, then:
#   sudo systemctl restart systemd-resolved
#
# Routes ONLY .cyberspace to the cybernet-resolver daemon (~cyberspace
# is a routing-only domain: nothing else leaves the system resolvers).
# The address:port suffix in DNS= is supported resolved syntax per
# resolved.conf(5) (cross-checked 2026-10-07) — verify with
#   resolvectl status | grep -A2 'DNS Servers'
# which should show 127.0.0.1 port 5353 on this link/global. If some
# ancient resolved ever ignores the suffix, run the daemon on port 53
# instead (CYBERNET_RESOLVER_PORT=53, needs root or
# CAP_NET_BIND_SERVICE) and drop the ":5353" below.

[Resolve]
DNS=127.0.0.1:5353
Domains=~cyberspace

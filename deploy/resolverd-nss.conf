# cybernet-agent.conf — systemd-resolved stub-zone glue for the per-agent
# .cyberspace resolver daemon (resolverd.service, 127.0.0.1:5353).
#
# Installed by deploy/install-agent.sh --nss into /etc/systemd/resolved.conf.d/.
# After that, every program on this machine resolves *.cyberspace through the
# agent's daemon — curl http://alice.cyberspace/ works, not just the shipped
# resolver.client. The daemon keeps answering fail-closed (NXDOMAIN for junk,
# SERVFAIL off-zone), so this changes reach, not trust.
#
# NOTE: only one ~cyberspace routing-domain entry may exist on a machine.
# The HQ operator-side split-horizon (/etc/systemd/resolved.conf.d/cyberspace.conf
# routing ~cyberspace to the HQ daemon) and this per-agent drop-in are
# alternatives — that is why install-agent.sh keeps --nss opt-in.

[Resolve]
DNS=127.0.0.1:5353
Domains=~cyberspace
